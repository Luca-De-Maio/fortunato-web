name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  qa-rubrics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa/rubrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: qa/rubrics/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run selftest
      - name: Catalog rubric on the public catalog snapshot
        run: CATALOG_FILE=targets/fortunato-web/catalog.snapshot.json npm test -- --rubric product-alignment
